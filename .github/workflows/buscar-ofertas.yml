name: Buscar ofertas Awin

on:
  schedule:
    # roda todo dia as 09:00 UTC (06:00 horario de Brasilia)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write   # commitar o historico de precos
  pages: write      # publicar a pagina de filtros
  id-token: write   # exigido pelo deploy-pages

# duas execucoes simultaneas escreveriam no mesmo historico e uma
# sobrescreveria a outra
concurrency:
  group: buscar-ofertas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar script de busca de ofertas
        env:
          AWIN_PRODUCTDATA_KEY: ${{ secrets.AWIN_PRODUCTDATA_KEY }}
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}  # fallback legado
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          AWIN_FEED_IDS: ${{ secrets.AWIN_FEED_IDS }}  # vazio = descobre pela regiao
          AWIN_REGIAO: ${{ vars.AWIN_REGIAO || 'BR' }}
          SITE_SENHA: ${{ secrets.SITE_SENHA }}  # vazio = site publicado em claro
        run: python buscar_ofertas.py

      - name: Commitar historico de precos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico/precos.csv output/panorama.md
          # sem mudanca de preco nao ha o que commitar, e tudo bem
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca no historico."
          else
            git commit -m "historico de precos: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Montar o site
        run: |
          mkdir -p site
          cp web/index.html site/
          # panorama.md NAO vai para o site: e texto em claro com lojas,
          # marcas e exemplos de produto -- publicar junto anularia a senha.
          # Ele continua versionado no repositorio.
          # com SITE_SENHA definida existe dados.bin (cifrado) e o dados.json
          # em claro foi apagado; sem ela, o contrario
          if [ -f output/dados.bin ]; then
            cp output/dados.bin site/
            MODO=cifrado
            echo "Publicando dataset cifrado."
          else
            cp output/dados.json site/
            MODO=aberto
            echo "AVISO: publicando dataset em claro (SITE_SENHA nao definida)."
          fi

          # grava o modo na propria pagina: deduzi-lo da existencia do arquivo
          # deixava a pagina refem de uma copia velha do dados.bin no cache
          BUILD="$(date -u +%Y-%m-%d\ %H:%M) UTC · ${GITHUB_SHA:0:7}"
          sed -i "s|__MODO__|$MODO|; s|__BUILD__|$BUILD|" site/index.html

          echo "modo=$MODO build=$BUILD"
          grep -c "__MODO__\|__BUILD__" site/index.html && \
            { echo "ERRO: marcador nao substituido"; exit 1; } || true
          ls -la site/

      # dados.json nao e commitado: sao ~1,3 MB que mudam todo dia, e o
      # repositorio incharia sem ganho nenhum. Vai direto para o Pages.
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Salvar resultado como artefato
        if: always()  # sobe os arquivos mesmo se o script falhar, pra poder diagnosticar
        uses: actions/upload-artifact@v4
        with:
          name: ofertas
          path: output/

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
