name: Buscar ofertas Awin

on:
  schedule:
    # roda todo dia as 09:00 UTC (06:00 horario de Brasilia)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botao "Run workflow"

# o job commita o historico de precos de volta no repositorio
permissions:
  contents: write

# duas execucoes simultaneas escreveriam no mesmo historico e uma
# sobrescreveria a outra
concurrency:
  group: buscar-ofertas
  cancel-in-progress: false

jobs:
  buscar-ofertas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar script de busca de ofertas
        env:
          AWIN_PRODUCTDATA_KEY: ${{ secrets.AWIN_PRODUCTDATA_KEY }}
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}  # fallback legado
          AWIN_FEED_IDS: ${{ secrets.AWIN_FEED_IDS }}  # vazio = descobre pela regiao
          AWIN_REGIAO: ${{ vars.AWIN_REGIAO || 'BR' }}
        run: python buscar_ofertas.py

      - name: Commitar historico de precos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico/precos.csv output/panorama.md
          # sem mudanca de preco nao ha o que commitar, e tudo bem
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca no historico."
          else
            git commit -m "historico de precos: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Salvar resultado como artefato
        if: always()  # sobe os arquivos mesmo se o script falhar, pra poder diagnosticar
        uses: actions/upload-artifact@v4
        with:
          name: ofertas
          path: output/
