name: Listar feeds Awin

# Workflow de diagnostico: roda sob demanda e imprime no log todos os feeds
# a que a conta tem acesso, com Advertiser ID e Feed ID lado a lado.
# Use para descobrir o valor correto de AWIN_FEED_IDS.

on:
  workflow_dispatch: {}

jobs:
  listar-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Listar feeds disponiveis
        env:
          AWIN_PRODUCTDATA_KEY: ${{ secrets.AWIN_PRODUCTDATA_KEY }}
          AWIN_TOKEN: ${{ secrets.AWIN_TOKEN }}  # fallback legado
        run: python listar_feeds.py
